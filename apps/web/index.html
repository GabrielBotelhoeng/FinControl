<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6F0" />
    <script>
      // Aplica o tema guardado antes do app carregar (sub-projeto 16, L1); o padrão é o claro.
      try {
        var t = localStorage.getItem('fincontrol-theme');
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#0B0D09';
        }
      } catch (e) {}
    </script>
    <meta name="description" content="FinControl: saiba quanto ganha, quanto gasta e para onde vai o seu dinheiro." />
    <title>FinControl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
