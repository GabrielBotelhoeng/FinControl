<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6F0" />
    <!--
      Quando o HTML estático da página não vale (com sessão, no app instalado, no retorno de login; o theme-init.js decide),
      o conteúdo gerado fica escondido desde o primeiro quadro, e o app é desenhado do zero (sub-projeto 18, E3). Estilo
      embutido é permitido pela CSP (style-src 'unsafe-inline'); script embutido, não.
    -->
    <style>html[data-boot="app"] #root[data-prerendered-route] { display: none; }</style>
    <!-- Tema guardado antes do app carregar (sub-projeto 16, L1). Em arquivo, não embutido: a CSP só aceita scripts do próprio site. -->
    <script src="/theme-init.js"></script>
    <title>FinControl — controle financeiro pessoal no celular e no computador</title>
    <!--
      SEO do site de apresentação (sub-projeto 17, S11). Esta é a cabeça da home; o build (src/prerender.tsx) gera o HTML
      de cada página pública com a cabeça própria (src/lib/public-head.ts), a casca do app (app.html) e o 404.html.
    -->
    <meta name="description" content="Saiba quanto entra, quanto sai e o que vence no mês. Contas, cartões, faturas, orçamento, metas e relatórios num app simples, em português. Experimente sem cadastro." />
    <link rel="canonical" href="https://fincontrol-gb.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="FinControl" />
    <meta property="og:title" content="FinControl — controle financeiro pessoal no celular e no computador" />
    <meta property="og:description" content="Saiba quanto entra, quanto sai e o que vence no mês. Contas, cartões, faturas, orçamento, metas e relatórios num app simples, em português. Experimente sem cadastro." />
    <meta property="og:url" content="https://fincontrol-gb.vercel.app/" />
    <meta property="og:image" content="https://fincontrol-gb.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O FinControl no celular, com o saldo no cartão limão, e o título Seu dinheiro, sob controle." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FinControl — controle financeiro pessoal no celular e no computador" />
    <meta name="twitter:description" content="Saiba quanto entra, quanto sai e o que vence no mês. Contas, cartões, faturas, orçamento, metas e relatórios num app simples, em português. Experimente sem cadastro." />
    <meta name="twitter:image" content="https://fincontrol-gb.vercel.app/og-image.png" />
    <!-- Dados estruturados: bloco de dados, não é executado, então a CSP (script-src 'self') não o bloqueia. Só a oferta grátis: os preços pagos de pricing.ts são provisórios (sub-projeto 18, E8). -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "FinControl",
          "url": "https://fincontrol-gb.vercel.app/",
          "description": "Controle financeiro pessoal em português e em reais: contas, cartões e faturas, orçamento, metas, dívidas e relatórios, no celular e no computador.",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web, Android, iOS",
          "inLanguage": "pt-BR",
          "image": "https://fincontrol-gb.vercel.app/og-image.png",
          "offers": [
            {
              "@type": "Offer",
              "name": "Grátis",
              "price": "0.00",
              "priceCurrency": "BRL"
            }
          ]
        },
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "O FinControl é grátis?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Hoje todos os recursos estão liberados de graça. No futuro, o plano Completo, com o assistente de IA e os relatórios, vai ter uma assinatura barata; o básico do dia a dia continua grátis."
              }
            },
            {
              "@type": "Question",
              "name": "Preciso instalar alguma coisa?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não. O FinControl funciona no navegador do celular e do computador. Se quiser, instale pela tela inicial para abrir como um app, sem passar pela loja."
              }
            },
            {
              "@type": "Question",
              "name": "Meus dados ficam seguros?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ficam num servidor em São Paulo, e cada consulta é filtrada pela sua conta: ninguém vê os lançamentos de outra pessoa. Não vendemos nem usamos seus dados para anúncios."
              }
            },
            {
              "@type": "Question",
              "name": "Funciona no iPhone?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, pelo Safari. Para usar como app, toque em Compartilhar e depois em \"Adicionar à Tela de Início\"."
              }
            },
            {
              "@type": "Question",
              "name": "Consigo importar o extrato do banco?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Envie o arquivo OFX ou CSV que o seu banco gera: o FinControl sugere as categorias, marca o que já foi lançado e mostra tudo antes de importar."
              }
            },
            {
              "@type": "Question",
              "name": "Posso apagar tudo?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Pode. Em Perfil, \"Excluir minha conta\" apaga a conta e todos os seus dados na hora, como manda a LGPD."
              }
            },
            {
              "@type": "Question",
              "name": "Como a demo funciona?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Você entra sem cadastro, com dados de exemplo já lançados, para mexer à vontade. A demo é apagada depois de 7 dias; para guardar os seus dados, crie uma conta."
              }
            }
          ]
        }
      ]
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
