name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fincontrol
          POSTGRES_PASSWORD: fincontrol
          POSTGRES_DB: fincontrol_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U fincontrol -d fincontrol_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (web buildada + API + Postgres, provedor de identidade simulado)
        run: npm run test:e2e
        env:
          CI: true
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
